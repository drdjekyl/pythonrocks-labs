[project]
name = "pythonrocks-labs"
version = "0.1.0"
description = "Code exécutable des articles techniques de pythonrocks.academy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
 "jupyter>=1.1",
 "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labs"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # Ces règles signalent les caractères « ambigus » (tiret demi-cadratin, signe ×,
    # espace fine). Ce sont précisément les caractères corrects en typographie
    # française, et ces textes finissent dans des graphiques lus par des humains.
    "RUF001",
    "RUF002",
    "RUF003",
]
